<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body><main class="canvas story tool {{ debug_class|default('') }}" style="--bg-position:{{ background_position|default('center center') }}">
<img class="bg" src="{{ background }}"><div class="overlay"></div><div class="grain"></div><div class="crop-guide"></div>
<div class="brand">LABAYKA <span class="gold">NUSUK</span></div><div class="brand-line"></div><div class="brand-diamond"></div>
<div class="safe-frame"><section class="content {{ density|default('medium') }}">
<div class="kicker">OUTIL DU PÈLERIN</div>
<div class="green-chip">{{ chip }}</div>
<h1 class="title">{{ title_before }}{% if title_highlight %} <span class="highlight">{{ title_highlight }}</span>{% endif %}</h1>
{% if copy %}<p class="copy">{{ copy }}</p>{% endif %}
{% if quote %}<div class="quote">{{ quote }}</div>{% endif %}
</section></div>
<div class="cta">{{ cta }}</div><div class="site">www.labaykanusuk.com</div>
<img class="sigle" src="{{ logo }}" alt="LABAYKANUSUK"></main></body></html>
