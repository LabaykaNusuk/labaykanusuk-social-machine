<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{font-family:Montserrat,Poppins,Arial,sans-serif;color:#F7F2E8;background:#130a1b}.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:#160c20}.photo{position:absolute;inset:0;background-image:url("{{BACKGROUND_DATA}}");background-size:cover;background-position:{{BACKGROUND_POSITION}};filter:saturate(.72) contrast(1.02) brightness(.69);transform:scale(1.035)}.photo2{position:absolute;inset:0;background-image:url("{{BACKGROUND_DATA}}");background-size:cover;background-position:80% 70%;opacity:.17;transform:scale(1.11)}.photo2:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#24003D 0%,rgba(36,0,61,.74) 45%,rgba(36,0,61,.14) 76%,transparent 100%)}.wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(36,0,61,.98) 0%,rgba(36,0,61,.87) 41%,rgba(16,19,31,.62) 74%,rgba(5,7,12,.87) 100%),linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.82))}.safe{position:absolute;inset:0;padding:92px 90px 76px;display:flex;flex-direction:column}.brand{font-size:31px;font-weight:800;letter-spacing:.035em;color:#fff}.brand span{color:#D6A72C}.brandline{width:275px;height:2px;background:#D6A72C;margin-top:25px;position:relative}.brandline:after{content:"";position:absolute;width:16px;height:16px;background:#D6A72C;left:45%;top:50%;transform:translate(-50%,-50%) rotate(45deg)}.counter{position:absolute;right:90px;top:92px;font-size:16px;font-weight:800;letter-spacing:.12em;color:#ddd4df;text-transform:uppercase}.content{margin:auto 0;display:grid;grid-template-columns:2px 1fr;gap:42px;width:925px}.vline{background:#D6A72C;min-height:690px}.tag{display:inline-block;background:#2E6B55;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 20px;font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:21px}.kicker{font-size:19px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#D6A72C;margin:0 0 18px}.answer{font-size:72px;line-height:1;font-weight:850;margin:0 0 22px;letter-spacing:-.035em}.answer span{color:#D6A72C}.explain{font-size:27px;line-height:1.40;color:#f6f1f7;width:810px;margin:0}.source{font-size:20px;line-height:1.40;color:#e4dce8;width:785px;margin:20px 0 22px;padding-left:17px;border-left:3px solid #D6A72C}.results{display:grid;gap:12px;width:760px}.result{padding:14px 17px;background:rgba(10,9,14,.25);border:1px solid rgba(255,255,255,.16)}.result strong{display:block;color:#D6A72C;font-size:17px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}.result p{margin:0;font-size:20px;line-height:1.33}.cta{display:inline-block;margin-top:20px;background:#2E6B55;color:#fff;padding:16px 23px;font-size:18px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}.appointment{font-size:19px;font-weight:780}.appointment:before{content:"";display:inline-block;width:14px;height:14px;background:#D6A72C;transform:rotate(45deg);margin-right:15px}.url{margin-top:28px;font-size:15px;color:#c9c2cc}.logo{width:96px;height:auto}
</style></head><body><section class="slide"><div class="photo"></div><div class="photo2"></div><div class="wash"></div><div class="safe"><div class="brand">LABAYKA<span>NUSUK</span></div><div class="brandline"></div><div class="counter">{{SECTION}} · {{CARD_COUNTER}}</div><div class="content"><div class="vline"></div><div><div class="tag">◈ LA RÉPONSE</div><p class="kicker">{{CATEGORY}}</p><h1 class="answer"><span>{{ANSWER_LETTER}}.</span> {{ANSWER}}</h1><p class="explain">{{ANSWER_TEXT}}</p><p class="source">{{SOURCE}}</p><div class="results"><div class="result"><strong>Tu avais juste ?</strong><p>{{RIGHT_MESSAGE}}</p></div><div class="result"><strong>Tu t’es trompé ?</strong><p>{{WRONG_MESSAGE}}</p></div></div><div class="cta">{{CTA_LABEL}}</div></div></div><footer class="footer"><div><div class="appointment">Apprendre, une question à la fois</div><div class="url">{{WEBSITE}}</div></div><img class="logo" src="{{LOGO_DATA}}" alt=""></footer></div></section></body></html>
