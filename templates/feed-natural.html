<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1350,initial-scale=1">
<title>LABAYKANUSUK • Feed naturel</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#140b20}
  body{font-family:Montserrat,Poppins,Arial,sans-serif;color:#f7f2e8}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;background:#140b20}
  .photo{position:absolute;inset:0;background-image:url('{{BACKGROUND_DATA}}');background-size:cover;background-repeat:no-repeat;background-position:{{BACKGROUND_POSITION}};transform:scale(1.012)}
  .vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,5,15,.12),rgba(9,5,15,.02) 45%,rgba(9,5,15,.20));pointer-events:none}
  .sidewash{position:absolute;top:0;bottom:0;width:68%;pointer-events:none}
  .panel-left .sidewash{left:0;background:linear-gradient(90deg,rgba(18,7,31,.97) 0%,rgba(27,8,45,.92) 28%,rgba(36,0,61,.74) 52%,rgba(36,0,61,.37) 72%,rgba(36,0,61,0) 100%)}
  .panel-right .sidewash{right:0;background:linear-gradient(270deg,rgba(18,7,31,.97) 0%,rgba(27,8,45,.92) 28%,rgba(36,0,61,.74) 52%,rgba(36,0,61,.37) 72%,rgba(36,0,61,0) 100%)}
  .brand{position:absolute;top:72px;display:flex;align-items:center;gap:18px;font-size:24px;font-weight:800;letter-spacing:.22em;color:#f7f2e8;white-space:nowrap}
  .panel-left .brand{left:60px}.panel-right .brand{right:60px}
  .brand-mark{color:#d6a72c;font-size:34px;line-height:1;letter-spacing:0}
  .content{position:absolute;top:244px;width:520px}
  .panel-left .content{left:60px;text-align:left}.panel-right .content{right:60px;text-align:right}
  .quote-mark{font-family:Georgia,'Times New Roman',serif;color:#d6a72c;font-size:98px;line-height:.78;margin:0 0 28px;font-weight:700}
  .quote{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:70px;line-height:1.03;letter-spacing:-.035em;font-weight:500;color:#fff;text-wrap:balance}
  .quote .gold{color:#e0ad31}
  .density-medium .quote{font-size:62px;line-height:1.04}
  .density-compact .quote{font-size:54px;line-height:1.06}
  .rule{margin-top:56px;width:150px;height:3px;border-radius:999px;background:linear-gradient(90deg,#d6a72c 0 62%,rgba(214,167,44,.25) 62% 100%)}
  .panel-right .rule{margin-left:auto;background:linear-gradient(270deg,#d6a72c 0 62%,rgba(214,167,44,.25) 62% 100%)}
  .footer{position:absolute;bottom:96px;font-size:20px;line-height:1.55;font-weight:500;letter-spacing:.01em;color:rgba(247,242,232,.96)}
  .panel-left .footer{left:60px;text-align:left}.panel-right .footer{right:60px;text-align:right}
  .footer-line{margin:0 0 8px}.dot{color:#d6a72c;padding:0 8px}
  .site{margin:0;color:#e0ad31;font-size:22px;font-weight:650;letter-spacing:.015em}
</style>
</head>
<body>
<main class="poster {{PANEL_CLASS}} {{DENSITY_CLASS}}">
  <div class="photo"></div>
  <div class="vignette"></div>
  <div class="sidewash"></div>

  <div class="brand"><span class="brand-mark">◈</span><span>LABAYKANUSUK</span></div>

  <section class="content">
    <div class="quote-mark">“</div>
    <h1 class="quote">{{QUOTE_BEFORE}} <span class="gold">{{QUOTE_HIGHLIGHT}}</span> {{QUOTE_AFTER}}</h1>
    <div class="rule"></div>
  </section>

  <footer class="footer">
    <p class="footer-line">Hajj <span class="dot">•</span> Omra <span class="dot">•</span> préparation du pèlerin</p>
    <p class="site">labaykanusuk.com</p>
  </footer>
</main>
</body>
</html>
