<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{font-family:Montserrat,Poppins,Arial,sans-serif;color:#F7F2E8;background:#130a1b}.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:#160c20}.photo{position:absolute;inset:0;background-image:url("{{BACKGROUND_DATA}}");background-size:cover;background-position:{{BACKGROUND_POSITION}};filter:saturate(.76) contrast(1.02) brightness(.72);transform:scale(1.035)}.photo2{position:absolute;inset:0;background-image:url("{{BACKGROUND_DATA}}");background-size:cover;background-position:72% 72%;opacity:.17;transform:scale(1.09)}.photo2:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#24003D 0%,rgba(36,0,61,.70) 44%,rgba(36,0,61,.12) 76%,transparent 100%)}.wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(36,0,61,.97) 0%,rgba(36,0,61,.84) 39%,rgba(18,22,33,.60) 72%,rgba(5,7,12,.86) 100%),linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.80))}.safe{position:absolute;inset:0;padding:92px 90px 76px;display:flex;flex-direction:column}.brand{font-size:31px;font-weight:800;letter-spacing:.035em;color:#fff}.brand span{color:#D6A72C}.brandline{width:275px;height:2px;background:#D6A72C;margin-top:25px;position:relative}.brandline:after{content:"";position:absolute;width:16px;height:16px;background:#D6A72C;left:45%;top:50%;transform:translate(-50%,-50%) rotate(45deg)}.counter{position:absolute;right:90px;top:92px;font-size:16px;font-weight:800;letter-spacing:.12em;color:#ddd4df;text-transform:uppercase}.content{margin:auto 0;display:grid;grid-template-columns:2px 1fr;gap:42px;width:920px}.vline{background:#D6A72C;min-height:630px}.tag{display:inline-block;background:#2E6B55;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 20px;font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px}.kicker{font-size:19px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#D6A72C;margin:0 0 24px}.question{font-size:59px;line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0;width:800px}.question .gold{color:#D6A72C}.choices{margin-top:34px;display:grid;gap:13px;width:680px}.choice{height:74px;display:flex;align-items:center;gap:18px;border:1px solid rgba(214,167,44,.62);background:rgba(12,10,18,.25);padding:12px 18px;font-size:24px;font-weight:750}.letter{display:grid;place-items:center;width:44px;height:44px;background:#D6A72C;color:#1b1022;font-size:21px;font-weight:900}.hook{margin-top:24px;font-size:19px;font-weight:650;color:#fff}.hook b{color:#D6A72C}.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}.appointment{font-size:19px;font-weight:780}.appointment:before{content:"";display:inline-block;width:14px;height:14px;background:#D6A72C;transform:rotate(45deg);margin-right:15px}.url{margin-top:28px;font-size:15px;color:#c9c2cc}.logo{width:96px;height:auto}
</style></head><body><section class="slide"><div class="photo"></div><div class="photo2"></div><div class="wash"></div><div class="safe"><div class="brand">LABAYKA<span>NUSUK</span></div><div class="brandline"></div><div class="counter">{{SECTION}} · {{CARD_COUNTER}}</div><div class="content"><div class="vline"></div><div><div class="tag">◈ {{RENDEZVOUS}}</div><p class="kicker">{{CATEGORY}}</p><h1 class="question">{{QUESTION_BEFORE}} <span class="gold">{{QUESTION_HIGHLIGHT}}</span> {{QUESTION_AFTER}}</h1><div class="choices"><div class="choice"><span class="letter">A</span>{{OPTION_A}}</div><div class="choice"><span class="letter">B</span>{{OPTION_B}}</div><div class="choice"><span class="letter">C</span>{{OPTION_C}}</div></div><div class="hook">{{HOOK}} <b>Swipe →</b></div></div></div><footer class="footer"><div><div class="appointment">Chaque soir à 21H</div><div class="url">{{WEBSITE}}</div></div><img class="logo" src="{{LOGO_DATA}}" alt=""></footer></div></section></body></html>
