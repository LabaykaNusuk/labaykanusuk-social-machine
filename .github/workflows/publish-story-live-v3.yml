          base64 --decode /tmp/story.b64 > docs/media/first-story-live-v3.jpg
          test -s docs/media/first-story-live-v3.jpg
          file docs/media/first-story-live-v3.jpg

      - name: Put Story online
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LABAYKANUSUK Social Machine"
          git config user.email "actions@users.noreply.github.com"
          git add docs/media/first-story-live-v3.jpg

          if ! git diff --cached --quiet; then
            git commit -m "Expose first Instagram Story live test"
            git push origin HEAD:main
          fi

      - name: Wait for public media
        id: media
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${ github.repository }/main/docs/media/first-story-live-v3.jpg"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 20); do
            if curl -L --fail --silent --show-error --max-time 20 "$URL" -o /tmp/public-story.jpg; then
              if [ -s /tmp/public-story.jpg ]; then
                echo "Public image ready."
                exit 0
              fi
            fi
            echo "Waiting for public image... $i/20"
            sleep 5
          done

          echo "Public image unavailable."
          exit 1

      - name: Verify Instagram account
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --fail-with-body             "https://graph.instagram.com/${IG_API_VERSION}/${IG_USER_ID}?fields=id,username&access_token=${IG_ACCESS_TOKEN}")
          echo "$RESPONSE" | jq -e '.id' >/dev/null
          echo "Instagram account connection OK."

      - name: Create Instagram Story container
        id: create
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          MEDIA_URL: ${{ steps.media.outputs.url }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --fail-with-body -X POST             "https://graph.instagram.com/${IG_API_VERSION}/${IG_USER_ID}/media"             --data-urlencode "image_url=${MEDIA_URL}"             --data-urlencode "media_type=STORIES"             --data-urlencode "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE" > /tmp/create.json
          CONTAINER_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$CONTAINER_ID" ]; then
            echo "Instagram did not return a container id."
            cat /tmp/create.json
            exit 1
          fi

          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "Story container created."

      - name: Wait until Story container is ready
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          CONTAINER_ID: ${{ steps.create.outputs.container_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            RESPONSE=$(curl -sS --fail-with-body               "https://graph.instagram.com/${IG_API_VERSION}/${CONTAINER_ID}?fields=status_code,status&access_token=${IG_ACCESS_TOKEN}")

            CODE=$(echo "$RESPONSE" | jq -r '.status_code // empty')

            if [ "$CODE" = "FINISHED" ]; then
              echo "Story container ready."
              exit 0
            fi

            if [ "$CODE" = "ERROR" ] || [ "$CODE" = "EXPIRED" ]; then
              echo "$RESPONSE"
              exit 1
            fi

            echo "Instagram processing... $i/30"
            sleep 4
          done

          echo "Container processing timeout."
          exit 1

      - name: PUBLISH STORY LIVE
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          CONTAINER_ID: ${{ steps.create.outputs.container_id }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --fail-with-body -X POST             "https://graph.instagram.com/${IG_API_VERSION}/${IG_USER_ID}/media_publish"             --data-urlencode "creation_id=${CONTAINER_ID}"             --data-urlencode "access_token=${IG_ACCESS_TOKEN}")

          MEDIA_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$MEDIA_ID" ]; then
            echo "Instagram publication failed."
            echo "$RESPONSE"
            exit 1
          fi

          echo "======================================"
          echo "INSTAGRAM STORY PUBLISHED SUCCESSFULLY"
          echo "Media ID: $MEDIA_ID"
          echo "======================================"
