name: LABAYKANUSUK Lexique Preview (DRY uniquement)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install jinja2 playwright
          playwright install --with-deps chromium
      - run: python src/lexique_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexique-preview
          path: lexique-preview.png
